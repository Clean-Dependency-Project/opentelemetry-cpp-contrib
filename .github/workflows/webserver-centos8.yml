name: webserver-debian-build

on:
  workflow_dispatch:

jobs:
  webserver-build-test:
    runs-on: ubuntu-latest
    name: webserver-debian-build

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build Debian-based Docker image (your new Dockerfile)
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          cd instrumentation/otel-webserver-module
          docker buildx build \
            -t otel_webserver_debian \
            -f docker/debian/Dockerfile \
            --load .

      # --------------------------------------------------------
      # Start container using a blocking process (never exits)
      # --------------------------------------------------------
      - name: Start container
        run: |
          docker run -idt \
            --entrypoint "" \
            --name otel_webserver_debian_container \
            otel_webserver_debian \
            tail -f /dev/null

          docker ps -a

      # --------------------------------------------------------
      # Build WebServer Module inside running container
      # --------------------------------------------------------
      - name: Build webserver module inside container
        run: |
          cd instrumentation/otel-webserver-module

          # clean old contents
          docker exec otel_webserver_debian_container bash -c \
            'rm -rf /otel-webserver-module/*'

          # copy repo contents into container
          docker cp . otel_webserver_debian_container:/otel-webserver-module/

          # execute gradle build
          docker exec otel_webserver_debian_container bash -c '
            cd /otel-webserver-module &&
            rm -rf build &&
            cp -r /dependencies /otel-webserver-module/ &&
            cp -r /build-dependencies /otel-webserver-module/ &&
            ./gradlew assembleWebServerModule
          '

      # --------------------------------------------------------
      # Extract build artifacts (.tgz file)
      # --------------------------------------------------------
      - name: Copy artifacts
        run: |
          mkdir -p /tmp/debian_build
          docker cp otel_webserver_debian_container:/otel-webserver-module/build/opentelemetry-webserver-sdk-x64-linux.tgz \
            /tmp/debian_build/

      # --------------------------------------------------------
      # Upload artifacts
      # --------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-webserver-sdk-x64-linux.tgz
          path: /tmp/debian_build/opentelemetry-webserver-sdk-x64-linux.tgz

      # --------------------------------------------------------
      # Cleanup container
      # --------------------------------------------------------
      - name: Cleanup
        run: |
          docker stop otel_webserver_debian_container || true
          docker rm otel_webserver_debian_container || true