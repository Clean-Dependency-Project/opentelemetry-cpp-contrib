name: webserver centos8

on:
  workflow_dispatch:

jobs:
  webserver-build-test-centos8:
    name: webserver-centos8-build
    runs-on: ubuntu-latest

    steps:
      - name: checkout otel webserver
        uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd instrumentation/otel-webserver-module
          docker buildx build -t apache_centos8 -f docker/centos8/Dockerfile --load .

      # IMPORTANT FIX: use `tail -f /dev/null` instead of sleep infinity
      - name: Start container
        run: |
          docker run -idt \
            --entrypoint "" \
            --name apache_centos8_container \
            apache_centos8 \
            tail -f /dev/null

          docker ps -a

      # Build inside container
      - name: Build webserver module
        run: |
          cd instrumentation/otel-webserver-module

          docker exec apache_centos8_container bash -c \
            'rm -rf /otel-webserver-module/*'

          docker cp . apache_centos8_container:/otel-webserver-module/

          docker exec apache_centos8_container bash -c '
            cd /otel-webserver-module &&
            rm -rf build &&
            cp -r /dependencies /otel-webserver-module/ &&
            cp -r /build-dependencies /otel-webserver-module/ &&
            ./gradlew assembleWebServerModule
          '


      # Copy artifacts
      - name: Copy artifacts
        run: |
          mkdir -p /tmp/apache_centos8
          docker cp apache_centos8_container:/otel-webserver-module/build/opentelemetry-webserver-sdk-x64-linux.tgz \
            /tmp/apache_centos8/

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-webserver-sdk-x64-linux.tgz
          path: /tmp/apache_centos8/opentelemetry-webserver-sdk-x64-linux.tgz

      # Stop and remove container  
      - name: Cleanup
        run: |
          docker stop apache_centos8_container || true
          docker rm apache_centos8_container || true