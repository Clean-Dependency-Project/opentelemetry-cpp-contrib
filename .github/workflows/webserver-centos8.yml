name: webserver debian build

on:
  workflow_dispatch:

jobs:
  webserver-build-test-centos8:
    name: webserver-centos8-build
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout GitHub Repo
      # --------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build CentOS 8 Docker Image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          cd instrumentation/otel-webserver-module
          docker buildx build \
            -t apache_centos8 \
            -f docker/centos8/Dockerfile \
            --load .

      # --------------------------------------------------------
      # Start container & keep it alive
      # --------------------------------------------------------
      - name: Start persistent container
        run: |
          docker run -idt \
            --entrypoint "" \
            --name apache_centos8_container \
            apache_centos8 \
            tail -f /dev/null

          echo "Container started:"
          docker ps -a

      # --------------------------------------------------------
      # Build inside container
      # --------------------------------------------------------
      - name: Build module inside container
        run: |
          cd instrumentation/otel-webserver-module

          # clean folder inside container
          docker exec apache_centos8_container bash -c \
            'rm -rf /otel-webserver-module/*'

          # copy latest repo code into container
          docker cp . apache_centos8_container:/otel-webserver-module/

          # run Gradle build inside CentOS 8 image
          docker exec apache_centos8_container bash -c '
            cd /otel-webserver-module &&
            rm -rf build &&
            cp -r /dependencies /otel-webserver-module/ &&
            cp -r /build-dependencies /otel-webserver-module/ &&
            ./gradlew assembleWebServerModule
          '

      # --------------------------------------------------------
      # Copy output .tgz artifact
      # --------------------------------------------------------
      - name: Copy artifacts
        run: |
          mkdir -p /tmp/apache_centos8
          docker cp apache_centos8_container:/otel-webserver-module/build/opentelemetry-webserver-sdk-x64-linux.tgz \
            /tmp/apache_centos8/

      # --------------------------------------------------------
      # Upload artifact
      # --------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-webserver-sdk-x64-linux.tgz
          path: /tmp/apache_centos8/opentelemetry-webserver-sdk-x64-linux.tgz

      # --------------------------------------------------------
      # Cleanup after workflow
      # --------------------------------------------------------
      - name: Cleanup
        run: |
          docker stop apache_centos8_container || true
          docker rm apache_centos8_container || true
